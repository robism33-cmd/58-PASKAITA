<!DOCTYPE html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkuliatorius</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="calculator">
      <div class="input-row">
        <span id="calculation"></span>
        <input type="text" id="calc-input" readonly />
      </div>

      <div class="buttons">
        <button onclick="onNumberClick(7)">7</button>
        <button onclick="onNumberClick(8)">8</button>
        <button onclick="onNumberClick(9)">9</button>
        <button class="op" onclick="onActionClick('X')">X</button>

        <button onclick="onNumberClick(4)">4</button>
        <button onclick="onNumberClick(5)">5</button>
        <button onclick="onNumberClick(6)">6</button>
        <button class="op" onclick="onActionClick('/')">/</button>

        <button onclick="onNumberClick(1)">1</button>
        <button onclick="onNumberClick(2)">2</button>
        <button onclick="onNumberClick(3)">3</button>
        <button class="op" onclick="onActionClick('+')">+</button>

        <button onclick="onNumberClick(0)">0</button>
        <button onclick="onCommaClick()">,</button>
        <button class="danger" onclick="onCleanClick()">C</button>
        <button class="equals" onclick="onCountClick()">=</button>

        <button class="op" onclick="onActionClick('-')">-</button>
        <button class="backspace" onclick="onBackspaceClick()">⌫</button>
      </div>

      <div class="history">
        <div class="history-controls">
          <button id="show-history" type="button">Atnaujinti istoriją</button>
          <button id="toggle-history" type="button">Slėpti istoriją</button>
          <button id="clear-history" type="button">Išvalyti istoriją</button>
        </div>

        <div class="history-items"></div>
      </div>
    </div>
  </body>
</html>
